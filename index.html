<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Whiteboard · infinite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
<canvas id="boardCanvas"></canvas>
<div id="cursorRing"></div>
<div class="zoom-indicator ui" id="zoomIndicator">100%</div>
<div class="dock ui" id="dock"></div>
<div class="tool-settings ui" id="toolSettings">
  <div class="settings-row" id="colorRow">
    <span class="settings-label">Color</span>
    <div class="color-swatches" id="colorSwatches">
      <div class="swatch active" style="background:#fff" data-color="#ffffff"></div>
      <div class="swatch" style="background:#5865f2" data-color="#5865f2"></div>
      <div class="swatch" style="background:#ed4245" data-color="#ed4245"></div>
      <div class="swatch" style="background:#57f287" data-color="#57f287"></div>
      <div class="swatch" style="background:#fee75c" data-color="#fee75c"></div>
      <div class="swatch" style="background:#eb459e" data-color="#eb459e"></div>
      <div class="swatch" style="background:#232428" data-color="#232428"></div>
      <div class="custom-color" title="Custom"><input type="color" id="customColorInput" value="#ffffff"></div>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">Size</span>
    <div class="size-slider-wrap">
      <input type="range" id="sizeSlider" min="1" max="80" value="4" step="1">
      <span class="size-value" id="sizeValue">4</span>
      <div class="size-preview"><div class="size-preview-spin"></div><div class="size-preview-dot" id="sizePreview" style="width:4px;height:4px;background:#fff"></div></div>
    </div>
  </div>
</div>
<button class="menu-btn ui" id="menuBtn" title="Settings"><i class="fas fa-cog"></i></button>
<div class="settings-panel ui" id="settingsPanel">
  <div class="panel-title"><i class="fas fa-sliders-h"></i> Settings</div>
  <div class="setting-group">
    <div class="setting-group-title">Canvas background</div>
    <div class="bg-options" id="bgOptions">
      <div class="bg-swatch active" style="background:#0a0a0c" data-bg="#0a0a0c"></div>
      <div class="bg-swatch" style="background:#ffffff" data-bg="#ffffff"></div>
      <div class="bg-swatch" style="background:#1e1f22" data-bg="#1e1f22"></div>
      <div class="bg-swatch" style="background:#2b2d31" data-bg="#2b2d31"></div>
      <div class="bg-swatch" style="background:#f0f2f5" data-bg="#f0f2f5"></div>
      <div class="bg-swatch" style="background:#e8eaed" data-bg="#e8eaed"></div>
      <div class="bg-custom" title="Custom image"><i class="fas fa-image"></i><input type="file" id="bgImageInput" accept="image/*"></div>
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-group-title">Grid</div>
    <div class="setting-row"><span class="setting-row-label">Show grid</span><div class="toggle-switch" id="gridToggle"></div></div>
    <div class="setting-row"><span class="setting-row-label">Grid size</span><div class="size-slider-wrap" style="flex:1"><input type="range" id="gridSizeSlider" min="20" max="120" value="40" step="5"><span class="size-value" id="gridSizeValue" style="min-width:28px">40</span></div></div>
  </div>
  <div class="setting-group">
    <div class="setting-group-title">Accent color</div>
    <div class="color-swatches" id="accentSwatches" style="margin-top:4px">
      <div class="swatch active" style="background:#5865f2" data-accent="#5865f2"></div>
      <div class="swatch" style="background:#ed4245" data-accent="#ed4245"></div>
      <div class="swatch" style="background:#57f287" data-accent="#57f287"></div>
      <div class="swatch" style="background:#fee75c" data-accent="#fee75c"></div>
      <div class="swatch" style="background:#eb459e" data-accent="#eb459e"></div>
      <div class="swatch" style="background:#9b59b6" data-accent="#9b59b6"></div>
      <div class="custom-color" title="Custom"><input type="color" id="accentColorInput" value="#5865f2"></div>
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-group-title">Tools</div>
    <div class="tool-list" id="toolList"></div>
    <div class="add-tool-row">
      <select id="addToolSelect">
        <option value="pen">Pen</option>
        <option value="eraser">Eraser</option>
        <option value="line">Line</option>
        <option value="rect">Rect</option>
        <option value="circle">Circle</option>
        <option value="text">Text</option>
        <option value="pin">Pin</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="pan">Pan</option>
      </select>
      <button id="addToolBtn"><i class="fas fa-plus"></i></button>
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-group-title">Interface</div>
    <div class="setting-row"><span class="setting-row-label">Hide dock</span><div class="toggle-switch" id="hideDockToggle"></div></div>
    <div class="setting-row"><span class="setting-row-label">Show zoom %</span><div class="toggle-switch on" id="showZoomToggle"></div></div>
  </div>
  <div class="setting-group">
    <div class="setting-group-title">Actions</div>
    <div class="panel-actions">
      <button class="panel-action-btn" id="undoBtnPanel"><i class="fas fa-undo-alt"></i> Undo</button>
      <button class="panel-action-btn danger" id="clearBtnPanel"><i class="fas fa-trash-alt"></i> Clear</button>
    </div>
    <div class="panel-actions" style="margin-top:6px">
      <button class="panel-action-btn" id="saveBtnPanel" style="flex:1"><i class="fas fa-download"></i> Export PNG</button>
    </div>
  </div>
</div>
<button class="dock-toggle ui" id="dockToggle" title="Show toolbar"><i class="fas fa-bars"></i></button>
<div class="hint-toast ui" id="hintToast"><i class="fas fa-info-circle"></i> <span id="hintText"></span></div>
<div class="media-settings" id="mediaSettings"></div>

<script>
  window.addEventListener('error', function(e){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b00020;color:#fff;font:13px monospace;padding:10px;white-space:pre-wrap';
    d.textContent = 'ERR: ' + e.message + ' | file: ' + (e.filename||'?') + ' | line: ' + e.lineno;
    document.body.appendChild(d);
  });
</script>

<!-- Проверяем каждый файл по одному: оборачиваем через onerror -->
<script src="js/utils.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:0;left:0;right:0;z-index:999999>FAILED: js/utils.js</div>')"></script>
<script src="js/core/state.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:30px;left:0;right:0;z-index:999999>FAILED: js/core/state.js</div>')"></script>
<script src="js/core/storage.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:60px;left:0;right:0;z-index:999999>FAILED: js/core/storage.js</div>')"></script>
<script src="js/core/camera.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:90px;left:0;right:0;z-index:999999>FAILED: js/core/camera.js</div>')"></script>
<script src="js/core/canvas.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:120px;left:0;right:0;z-index:999999>FAILED: js/core/canvas.js</div>')"></script>
<script src="js/core/tools.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:150px;left:0;right:0;z-index:999999>FAILED: js/core/tools.js</div>')"></script>
<script src="js/draw/drawStroke.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:180px;left:0;right:0;z-index:999999>FAILED: js/draw/drawStroke.js</div>')"></script>
<script src="js/draw/strokes.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:210px;left:0;right:0;z-index:999999>FAILED: js/draw/strokes.js</div>')"></script>
<script src="js/draw/erase.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:240px;left:0;right:0;z-index:999999>FAILED: js/draw/erase.js</div>')"></script>
<script src="js/media/videoControls.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:270px;left:0;right:0;z-index:999999>FAILED: js/media/videoControls.js</div>')"></script>
<script src="js/media/media.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:300px;left:0;right:0;z-index:999999>FAILED: js/media/media.js</div>')"></script>
<script src="js/ui/cursorRing.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:330px;left:0;right:0;z-index:999999>FAILED: js/ui/cursorRing.js</div>')"></script>
<script src="js/ui/textEditor.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:360px;left:0;right:0;z-index:999999>FAILED: js/ui/textEditor.js</div>')"></script>
<script src="js/ui/dock.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:390px;left:0;right:0;z-index:999999>FAILED: js/ui/dock.js</div>')"></script>
<script src="js/ui/settings.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:420px;left:0;right:0;z-index:999999>FAILED: js/ui/settings.js</div>')"></script>
<script src="js/input/pointer.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:450px;left:0;right:0;z-index:999999>FAILED: js/input/pointer.js</div>')"></script>
<script src="js/input/touch.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:480px;left:0;right:0;z-index:999999>FAILED: js/input/touch.js</div>')"></script>
<script src="js/input/desktop.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:510px;left:0;right:0;z-index:999999>FAILED: js/input/desktop.js</div>')"></script>
<script src="js/main.js" onerror="document.body.insertAdjacentHTML('beforeend','<div style=background:red;color:#fff;padding:6px;font:12px monospace;position:fixed;top:540px;left:0;right:0;z-index:999999>FAILED: js/main.js</div>')"></script>

<script>
  setTimeout(function(){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:999999;background:#0a3d0a;color:#9f9;font:12px monospace;padding:6px;white-space:pre-wrap';
    var list = ['Utils','State','Storage','Camera','Canvas','Tools','DrawStroke','Strokes','Erase','VideoControls','Media','CursorRing','TextEditor','Dock','UI','Pointer'];
    var out = 'MODULES:\n';
    list.forEach(function(k){
      try { out += k + ' = ' + (typeof eval(k)) + '\n'; }
      catch(e){ out += k + ' = ERROR(' + e.message + ')\n'; }
    });
    out += 'canvas = ' + (document.getElementById('boardCanvas') ? 'OK' : 'NULL') + '\n';
    out += 'canvas size = ' + document.getElementById('boardCanvas').width + 'x' + document.getElementById('boardCanvas').height + '\n';
    d.textContent = out;
    document.body.appendChild(d);
  }, 1000);
</script>
</body>
</html>
